plugins {
    id 'com.android.application'
}

android {
    namespace 'com.movieprop.ticket'
    compileSdk 35

    defaultConfig {
        applicationId 'com.movieprop.ticket'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
